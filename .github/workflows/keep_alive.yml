name: Keep Alive

# Render's free tier sleeps after 15 minutes idle and takes ~50s to wake,
# which is long enough that a prospective client assumes the site is broken.
#
# Inactive until the SITE_URL repository variable is set (Settings ->
# Secrets and variables -> Actions -> Variables), e.g.
# https://twinbrooks.onrender.com — so it does not fail hourly before deploy.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL is not set yet — skipping. Set it after the Render deploy."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${SITE_URL%/}/health")
          echo "GET ${SITE_URL%/}/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Expected 200, got $code"
            exit 1
          fi

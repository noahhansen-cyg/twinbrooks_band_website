# The four event types the band names on twinbrooks.band/contact ("weddings and
# corporate gatherings to private parties and live venues").
#
# NOTE: the live site gives no per-service copy, so each description below is
# assembled from the band's own sentences elsewhere on the site and from the
# member bios. Replace them with your own words when you have them.
- name: Weddings
  description: >
    60s soul, 80s rock, and 2000s pop, played live — the energy, entertainment,
    and music your guests will be talking about long after the last song.

- name: Corporate Gatherings
  description: >
    A multi-genre set that reads the room, from background music over dinner to
    a full dance floor once the night opens up.

- name: Private Parties
  description: >
    From weddings to happy hours and everything in between. Tell us the
    occasion and we will build the night around it.

- name: Live Venues
  description: >
    A full live show for bars, breweries, and festivals — the band has played
    Farm Brew Live, Falls Church State Theater, Cherry Blossom Festival, and
    the GMU Patriot Center.

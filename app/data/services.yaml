- name: Weddings
  description: >
    Ceremony, cocktail hour, and reception covered end to end. We handle the
    first dance, the parent dances, and the announcements, and we work from your
    timeline so nothing gets missed.

- name: Corporate Events
  description: >
    Background music during dinner and a full dance set afterward, scaled to the
    room. We can play as a trio for smaller spaces or the full band for a
    ballroom.

- name: Private Parties
  description: >
    Birthdays, anniversaries, and holiday parties. Tell us the occasion and the
    crowd and we will build a set around it.

- name: Festivals & Venues
  description: >
    A high-energy original-and-covers set for public shows, with our own PA and
    lighting if the venue does not provide them.

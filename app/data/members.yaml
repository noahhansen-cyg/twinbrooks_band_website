# The lineup, in the order it appears on twinbrooks.band/the-members.
# Bios are the band's own copy from that page. Photos live in
# app/static/assets/members/ — drop a replacement in at the same filename and
# the card picks it up; remove the photo line and the card falls back to initials.
- name: Noah Hansen
  instrument: Drummer
  photo: members/noah.jpg
  bio: >
    Meet our drummer Noah! Noah has been a musician for over 15 years and has a
    wide variety of genres and styles under his belt. From classical percussion,
    to classic rock, to r&b, to prog, Noah has had the chance to play almost all
    types of music!

- name: Nick Dache
  instrument: Keys
  photo: members/nick.jpg
  bio: >
    Nick Dache is still trying to run away and join the circus. He's got a
    passion for songwriting and has learned how to play all the rock instruments
    to support his visions. He's played in Go-go, jazz, funk, rock, and a handful
    of other projects that needed backflips.

- name: Ian Meyer
  instrument: Lead Guitar / Sound & Lights
  photo: members/ian.jpg
  bio: >
    Ian is an experienced live sound engineer, lighting designer, and
    multi-instrumentalist with over 10 years of performance and production
    experience. He is skilled in delivering stage shows through hands-on mixing,
    lighting control, and professional musicianship. Ian has played at Farm Brew
    Live, GMU Patriot Center, Falls Church State Theater, Cherry Blossom
    Festival, and Renegade.

- name: Leif Jomuad
  instrument: Guitar / Sound
  photo: members/leif.jpg
  bio: >
    LEIF, the Philippines-born sensation, crafts mesmerizing tunes as a
    pop/alternative pop artist with a hint of alternative rock igniting the DMV
    and Washington DC music scene. Featured on Hot 99.5 and iHeart Radio, his
    Nu-Disco gem "Lucid" radiated brilliance. The Washington Post hailed his
    artistry within the eclectic collective, "Washington Rizzards," alongside
    luminaries like J Matty, Tina Carzon, and Bema Tadey.

- name: Randie Goode
  instrument: Lead Singer
  photo: members/randie.jpg
  bio: >
    Randie Goode is a 26-year-old professional musician and the band's lead
    singer, with a passion for performing that began in the third grade. He began
    taking his musical career seriously during his freshman year of high school,
    when he also picked up the trumpet and expanded his versatility as an artist.
    Over the years, Randie has performed at weddings, live music venues,
    churches, choirs, and musical productions — seizing every opportunity to be
    on stage. His experience includes collaborating with notable DMV artists and
    bands such as The Wrizzards, Bachelor Boys Band, Jovanni Cardenas, Stephen
    Sol & the 7, and many other talented performers throughout the region.

- name: Mayson Rangel
  instrument: Bass
  photo: members/mayson.jpg
  bio: >
    Mayson is a life long musician, multi instrumentalist, and Alexandria native.
    Bouncing from instrument to instrument as a kid, he played jazz drums for
    years until transitioning to bass. Using jazz as a starting point, he has
    spent the past 6 years performing other genres like indie, rock, blues, funk,
    Latin, and prog rock. Mayson also organizes video game music jams in the DMV
    as a founding member of the organization "DC VGM Jams".

name: Twinbrooks
tagline: Live music that keeps the floor full

hero_heading: Twinbrooks
hero_subheading: A live band for weddings, corporate events, and private parties

who_we_are:
  heading: Who We Are
  paragraphs:
    - >
      Twinbrooks is a four-piece live band built for events where the music
      matters. We have spent years reading rooms — knowing when to pull back
      during dinner and when to push the tempo once the floor fills up.
    - >
      Our set spans six decades of music people actually want to hear, arranged
      to move from one era to the next without ever clearing the dance floor.
      Every song is played live. No backing tracks, no laptops.

contact:
  heading: Get In Touch
  blurb: >
    Tell us about your event and we will get back to you within two business
    days with availability and pricing.

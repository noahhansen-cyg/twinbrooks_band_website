- title: Everything Played Live
  description: >
    No backing tracks and no laptops. What you hear is four musicians playing,
    which means we can stretch a song that is working or cut one that is not.

- title: We Read The Room
  description: >
    Set lists are a starting point, not a script. We adjust song by song based on
    who is actually on the floor.

- title: One Point Of Contact
  description: >
    You deal with one person from first email through load-out. No agency layer
    and no surprise substitutions on the day of your event.

- title: Sound And Lighting Included
  description: >
    We bring a professional PA and stage lighting sized to your venue, and we
    arrive early enough to sound check before guests are in the room.

# Assembled from facts on twinbrooks.band — the home page pitch and the
# credentials in the member bios. Every claim here traces back to something the
# live site already says. Rewrite in your own voice when you have time.
- title: We Cover It ALL
  description: >
    A multi-genre cover band, not a one-era tribute act. 60s soul, to 80s rock,
    to 2000s pop — whatever the room wants to hear.

- title: Sound And Lighting In-House
  description: >
    Ian is a working live sound engineer and lighting designer with over 10
    years of production experience, so the mix and the stage look are handled by
    the band rather than left to the venue.

- title: Stages We Have Played
  description: >
    Farm Brew Live, the GMU Patriot Center, Falls Church State Theater, the
    Cherry Blossom Festival, and Renegade — the band is built from players who
    already work the DMV's rooms.

- title: DMV Musicians, Not A Booking Agency
  description: >
    Six working musicians with credits from Hot 99.5 and iHeart Radio to The
    Washington Post, playing together — no agency layer between you and the
    people on stage.
